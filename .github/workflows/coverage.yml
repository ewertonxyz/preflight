name: Coverage

# The coverage run, on a fresh clone. What it guards is that every test project
# was measured and that the number is reproducible somewhere other than the
# machine that wrote the code.
#
# The upload to Codecov is the last step and the only optional one: it runs when
# CODECOV_TOKEN is present, and says out loud that it was skipped when it is
# not. A coverage job that uploaded nothing without saying so would report
# success for a step that never ran, which is the outcome this project refuses
# everywhere else.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run costs nothing; only the head commit's verdict
  # matters there. A superseded push run costs the verdict of a commit that is
  # already on a shared branch - two merges a minute apart would leave the first
  # one never judged, which is the commit somebody bisecting a red dev needs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage (Windows, Release)
    runs-on: windows-latest
    timeout-minutes: 30

    # ContinuousIntegrationBuild is deliberately NOT set here, and this is the
    # one line of this file most likely to be "helpfully" added later. It
    # normalises PDB source paths to /_/, coverlet then cannot map IL back to
    # source, and the run measures nothing. That is the failure the guard in
    # scripts/coverage.ps1 exists to catch.

    steps:
      - uses: actions/checkout@v7

      - name: Set up the .NET toolchain
        uses: ./.github/actions/dotnet-toolchain

      # The script, not a reimplementation of it in YAML. It carries the exclude
      # list, the .Tests/.Specs discriminator, and the guard that fails a run
      # which did not measure every test project - a guard that has already
      # caught a real silent failure. A second copy of that in YAML is a copy
      # that goes stale without saying so.
      #
      # It restores tools and builds on its own, so there is no separate restore
      # or build step above it.
      #
      # The explicit LASTEXITCODE check is belt and braces: the script's fatal
      # paths use both `exit` and Write-Error, and a coverage step that exits 0
      # after failing would report success for the one measurement whose job is
      # to notice a run that measured nothing.
      - name: Collect coverage
        shell: pwsh
        run: |
          & .\scripts\coverage.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # What gets uploaded is read off what the step above actually wrote, and
      # is never typed out here. The script discovers its test projects by their
      # .Tests and .Specs suffix and fails a run that measured fewer than it
      # found, so the contents of the raw directory are already the complete
      # set. A list written by hand instead names today's four projects forever:
      # the day a fifth arrives, the script measures it, this file uploads four,
      # and the job is green over three quarters of the suite. The uploader does
      # not catch that either - it treats an input file it cannot find as a
      # warning and uploads the rest, which fail_ci_if_error does not cover.
      #
      # Nothing stale can be picked up. The script removes the raw directory
      # before it collects, and on a fresh clone there is none to begin with, so
      # every file listed here was written by the run that is uploading it.
      #
      # One line, comma-separated, and no whitespace anywhere near a comma. That
      # is the only form the action accepts, and both of the obvious ways of
      # writing several paths in YAML have already failed here:
      #
      #   files: |          a block scalar. The action's wrapper sets IFS=","
      #                     before splitting this value, so newlines are not
      #                     separators at all. All four paths arrived as ONE
      #                     --file argument with newlines inside it, matching no
      #                     file, and the run failed with "No coverage reports
      #                     found" having uploaded nothing.
      #
      #   files: >-         a folded scalar of comma-separated paths. Folding
      #                     turns each newline into a space, the wrapper splits
      #                     on the comma and does not trim, and every path after
      #                     the first arrived with a leading space. Three of the
      #                     four went missing that way and the badge reported one
      #                     test project as though it were the whole suite.
      - name: List the coverage reports
        id: reports
        shell: pwsh
        run: |
          $rawDir = 'artifacts/coverage/raw'

          if (-not (Test-Path -LiteralPath $rawDir)) {
            Write-Error "Coverage collection wrote no $rawDir directory. There is nothing to upload."
            exit 1
          }

          $reports = @(
            Get-ChildItem -LiteralPath $rawDir -Filter '*.cobertura.xml' -File |
              Sort-Object -Property Name |
              ForEach-Object { "$rawDir/$($_.Name)" }
          )

          if ($reports.Count -eq 0) {
            Write-Error "Coverage collection produced no report in $rawDir. There is nothing to upload."
            exit 1
          }

          Write-Host "Reports to upload ($($reports.Count)): $($reports -join ', ')"
          "files=$($reports -join ',')" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ReportGenerator already writes this file; not using it would mean
      # generating a report for nobody.
      - name: Publish the summary
        if: always()
        shell: pwsh
        run: |
          $summary = 'artifacts/coverage/report/SummaryGithub.md'
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary -Raw |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      # The HTML is the only coverage output that does not fit in a log, and it
      # is what gets opened on the day the number drops.
      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/report/
          retention-days: 14

      # Two situations produce no token, and neither is a defect: a repository
      # not yet connected to Codecov has none to give, and a pull request from a
      # fork never receives secrets. Skipping is the right answer to both.
      # Failing would make the job permanently red for a reason nobody in the
      # repository can fix, and a badge that is always red stops being read.
      #
      # What is not acceptable is skipping quietly, so this step writes the
      # reason into the job summary either way.
      - name: Check for the Codecov token
        id: codecov_token
        shell: pwsh
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          $present = -not [string]::IsNullOrWhiteSpace($env:CODECOV_TOKEN)
          "present=$($present.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($present) {
            $note = "Codecov: token present, uploading."
          }
          else {
            $note = "Codecov: **skipped, no CODECOV_TOKEN**. Expected on pull requests from forks, and until the repository is connected to Codecov. The coverage above was measured and is real; it was simply not published."
          }

          Write-Host $note
          $note | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # The raw per-project reports, and this is measured rather than assumed.
      # ReportGenerator's merged output records filename as the absolute path of
      # the machine that measured, backslashes and all, and Codecov matches what
      # it receives against the repository tree - so every file would land
      # unmatched and the badge would be green over no data. That is why the
      # merged report is no longer generated at all. The raw reports record
      # filename="Preflight.Core/Changes/GitChangeSource.cs", relative and with
      # forward slashes; .github/codecov.yml puts back the src/ prefix that
      # <source> consumed. Codecov merges multiple uploads by taking the maximum
      # hits per line, so nothing is counted twice.
      #
      # disable_search, so this upload carries the list the step above built out
      # of what was measured, and nothing else the runner happens to find beside
      # it.
      - name: Upload to Codecov
        if: steps.codecov_token.outputs.present == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: true
