name: Build

# The cheapest of the three, and the first place to look when something is red:
# it answers "does this compile clean and is it formatted", and nothing else.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run costs nothing; only the head commit's verdict
  # matters there. A superseded push run costs the verdict of a commit that is
  # already on a shared branch - two merges a minute apart would leave the first
  # one never judged, which is the commit somebody bisecting a red dev needs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Windows, Release)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up the .NET toolchain
        uses: ./.github/actions/dotnet-toolchain

      - name: Restore
        run: dotnet restore

      # .editorconfig is enforced at build time through EnforceCodeStyleInBuild,
      # but whitespace and using-ordering are not compiler diagnostics.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # TreatWarningsAsErrors is set in Directory.Build.props; there is no
      # separate warning gate here.
      - name: Build
        run: dotnet build --configuration Release --no-restore
