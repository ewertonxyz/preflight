name: Tests

# The whole suite and nothing else: the unit tests, the command line's
# end-to-end tests and the Gherkin specifications, run against a build this
# workflow makes for itself. It says nothing about formatting and nothing about
# coverage, so a failure here is always a behaviour that changed.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run costs nothing; only the head commit's verdict
  # matters there. A superseded push run costs the verdict of a commit that is
  # already on a shared branch - two merges a minute apart would leave the first
  # one never judged, which is the commit somebody bisecting a red dev needs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Windows, Release)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up the .NET toolchain
        uses: ./.github/actions/dotnet-toolchain

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The runner is Microsoft.Testing.Platform, selected in global.json. A test
      # project containing zero tests fails with exit code 8, deliberately, and
      # nothing here swallows it.
      - name: Test
        run: dotnet test --configuration Release --no-build
